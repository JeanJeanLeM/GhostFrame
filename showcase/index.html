<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motions — voir et télécharger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #faf7f2;
      --ink: #1c1917;
      --muted: #78716c;
      --teal: #0f766e;
      --line: #e7e0d6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Outfit, sans-serif;
    }
    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 56px 24px 12px;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--teal);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Fraunces, serif;
      font-weight: 560;
      font-size: clamp(40px, 5vw, 64px);
      letter-spacing: -0.03em;
      line-height: 1.02;
    }
    header p {
      max-width: 38rem;
      color: #44403c;
      font-size: 18px;
      line-height: 1.5;
    }
    main { max-width: 1180px; margin: 0 auto; padding: 12px 24px 72px; }
    h2 {
      margin: 36px 0 16px;
      font-family: Fraunces, serif;
      font-size: 32px;
      font-weight: 560;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 22px;
    }
    article {
      background: white;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(28, 25, 23, 0.06);
    }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      object-fit: contain;
    }
    .meta { padding: 16px 16px 18px; }
    .meta h3 { margin: 0 0 6px; font-size: 18px; }
    .meta p { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.4; }
    .row { display: flex; gap: 8px; }
    .row a, .play {
      flex: 1;
      text-align: center;
      text-decoration: none;
      border-radius: 999px;
      padding: 10px 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .play {
      background: var(--cream);
      color: var(--ink);
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }
    .dl { background: var(--teal); color: white; }
    footer {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px 48px;
      color: var(--muted);
      font-size: 13px;
    }
    #status { color: #8a3d2e; }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow" id="eyebrow">Motions</p>
    <h1 id="title">Les motions à voir et à télécharger.</h1>
    <p id="intro"></p>
  </header>
  <main id="main">
    <p id="status" hidden></p>
  </main>
  <footer>Chaque section est un dossier dans exports/. Les agents ajoutent un film dans films.json, ils ne créent pas une nouvelle page.</footer>
  <script>
    function card(file, title, text, poster) {
      const src = "exports/" + file;
      const el = document.createElement("article");
      el.innerHTML = `
        <video src="${src}" poster="${poster ? "exports/" + poster : ""}" preload="metadata" playsinline controls></video>
        <div class="meta">
          <h3></h3>
          <p></p>
          <div class="row">
            <button class="play" type="button">Lire</button>
            <a class="dl" href="${src}" download>Télécharger</a>
          </div>
        </div>`;
      el.querySelector("h3").textContent = title;
      el.querySelector("p").textContent = text;
      el.querySelector(".play").addEventListener("click", () => {
        const video = el.querySelector("video");
        if (video.paused) video.play();
        else video.pause();
      });
      return el;
    }

    fetch("films.json")
      .then((response) => {
        if (!response.ok) throw new Error("films.json introuvable");
        return response.json();
      })
      .then((data) => {
        document.getElementById("eyebrow").textContent = data.eyebrow || "Motions";
        document.getElementById("title").textContent = data.title;
        document.getElementById("intro").textContent = data.intro || "";
        const main = document.getElementById("main");
        for (const section of data.sections || []) {
          const heading = document.createElement("h2");
          heading.id = section.id;
          heading.textContent = section.title;
          const grid = document.createElement("div");
          grid.className = "grid";
          for (const film of section.films || []) {
            grid.append(card(film.file, film.title, film.text, film.poster));
          }
          main.append(heading, grid);
        }
      })
      .catch((error) => {
        const status = document.getElementById("status");
        status.hidden = false;
        status.textContent = error.message;
      });
  </script>
</body>
</html>
