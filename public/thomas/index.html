<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thomas — Ghost Frame</title>
    <meta name="description" content="Film de Thomas : les phases de Ghost Frame, à regarder et à télécharger." />
    <link rel="icon" href="/ghost-frame-icon-32.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f3eee4;
        color: #1c2430;
        font-family: Inter, "Noto Sans", sans-serif;
      }
      .wrap { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 72px; }
      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
      .brand { display: flex; gap: 12px; align-items: center; color: inherit; text-decoration: none; }
      .brand img { width: 64px; height: 64px; object-fit: contain; }
      .brand strong { display: block; font-size: 18px; }
      .brand span { color: #5c6b7a; font-size: 13px; }
      .back { color: #2e6bb0; font-weight: 700; text-decoration: none; }
      h1 { margin: 0 0 8px; font-size: clamp(36px, 5vw, 64px); letter-spacing: -0.045em; line-height: 0.95; }
      .intro { margin: 0 0 22px; max-width: 620px; color: #4d5b6a; font-size: 18px; line-height: 1.45; }
      .player { background: white; border-radius: 28px; padding: 12px; box-shadow: 0 24px 60px rgba(28, 36, 48, 0.08); }
      video { width: 100%; border-radius: 18px; background: #f3eee4; display: block; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 18px; }
      .download, .alt {
        display: inline-flex; align-items: center; min-height: 52px; padding: 0 20px;
        border-radius: 14px; text-decoration: none; font-weight: 750;
      }
      .download { background: #2e6bb0; color: white; }
      .alt { border: 1.5px solid #d9d0c2; color: #1c2430; }
      .meta { margin-left: auto; color: #5c6b7a; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <a class="brand" href="/">
          <img src="/thomas/thomas-hero.png" alt="" />
          <div>
            <strong>Thomas</strong>
            <span>présente Ghost Frame</span>
          </div>
        </a>
        <a class="back" href="/">← Retour au jeu</a>
      </header>
      <h1>Les phases du jeu.</h1>
      <p class="intro">Thomas déroule la partie : les cartes, un mot, la discussion, l’élimination, la devinette, les scores.</p>
      <div class="player">
        <video id="film" controls playsinline preload="metadata" poster="/thomas/poster.jpg" src="/thomas/thomas-ghostframe.mp4">
          <a href="/thomas/thomas-ghostframe.mp4">Télécharger le film</a>
        </video>
      </div>
      <div class="actions">
        <a class="download" href="/thomas/thomas-ghostframe.mp4" download="thomas-ghostframe.mp4">Télécharger la vidéo</a>
        <a class="alt" href="/">Jouer une partie</a>
        <p class="meta">Film muet · 26 s · 1920×1080</p>
      </div>
    </div>
  </body>
</html>
